name: Relock harness dependencies

# The container harness installs from a committed lock so a container boot never
# re-resolves the dependency graph against Packagist. That lock would otherwise
# freeze the SilverStripe version the module is tested against, which is exactly
# the coverage `.docker/app/composer.json` keeps ranges for. Regenerate it weekly
# and raise a PR, so the float is still followed — just deliberately, in a change
# CI can gate, rather than silently on every container start.

on:
  schedule:
    # Mondays 04:00 UTC — before European working hours, after the weekend's
    # upstream releases have settled.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relock:
    name: Regenerate composer locks
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      COMPOSE: docker compose -f .docker/compose.yml -f .docker/compose.ci.yml
      COMPOSE_BAKE: 'true'
      CACHE_SCOPE: app-php8.3
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-docker-mirror
      - run: task docker-env
      - run: task relock

      # One fixed branch, rebuilt from 6 on every run: an unmerged relock PR is
      # updated in place instead of a new one opening beside it each week, and it
      # closes itself once 6 already holds current locks.
      - name: Raise, refresh or close the relock pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: chore/relock
        run: |
          open_pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')

          if git diff --quiet -- .docker/app/composer.lock .docker/app/composer.modules.lock; then
            echo "Locks already current — nothing to raise."
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --delete-branch --comment 'Superseded: `6` already holds current locks.'
            fi
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -C "$BRANCH"
          git add .docker/app/composer.lock .docker/app/composer.modules.lock
          git commit -m 'build(deps): relock the container harness'
          # The checkout's refspec maps 6 only, so a bare --force-with-lease finds
          # no tracking ref and rejects as stale. Lease on the tip read from the
          # remote instead; an empty value means "must not exist yet".
          expected=$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)
          git push --force-with-lease="refs/heads/$BRANCH:$expected" origin "$BRANCH"

          if [ -z "$open_pr" ]; then
            gh pr create \
              --base 6 \
              --head "$BRANCH" \
              --title 'build(deps): relock the container harness' \
              --body 'Weekly regeneration of the container composer locks, so the harness keeps testing against current SilverStripe 6.x releases. Generated by `.github/workflows/relock.yml`, which rebuilds this branch from `6` on every run; reproduce locally with `task relock`.'
          fi

          # A pull_request run for a PR that GITHUB_TOKEN opened or pushed waits
          # for manual approval (action_required), so the relock would never be
          # gated. A dispatch is not held, and its checks land on the head commit
          # the PR shows.
          gh workflow run ci.yml --ref "$BRANCH"
      - name: Container diagnostics
        if: failure()
        uses: ./.github/actions/container-diagnostics
        with:
          compose: ${{ env.COMPOSE }}
