name: Relock harness dependencies

# The container harness installs from a committed lock so a container boot never
# re-resolves the dependency graph against Packagist. That lock would otherwise
# freeze the SilverStripe version the module is tested against, which is exactly
# the coverage `.docker/app/composer.json` keeps ranges for. Regenerate it weekly
# and raise a PR, so the float is still followed — just deliberately, in a change
# CI can gate, rather than silently on every container start.

on:
  schedule:
    # Mondays 04:00 UTC — before European working hours, after the weekend's
    # upstream releases have settled.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relock:
    name: Regenerate composer locks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      COMPOSE: docker compose -f .docker/compose.yml -f .docker/compose.ci.yml
      COMPOSE_BAKE: 'true'
      CACHE_SCOPE: app-php8.3
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-docker-mirror
      - run: task docker-env
      - run: task relock

      - name: Open a pull request if anything moved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- .docker/app/composer.lock .docker/app/composer.fluent.lock; then
            echo "Locks already current — nothing to raise."
            exit 0
          fi

          branch="chore/relock-$(date -u +%Y-%m-%d)"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add .docker/app/composer.lock .docker/app/composer.fluent.lock
          git commit -m 'build(deps): relock the container harness'
          git push --force-with-lease origin "$branch"

          # `|| true` covers the re-run case: the branch already carries an open
          # PR, and pushing to it is the whole update.
          gh pr create \
            --base 6 \
            --head "$branch" \
            --title 'build(deps): relock the container harness' \
            --body 'Weekly regeneration of the container composer locks, so the harness keeps testing against current SilverStripe 6.x releases. Generated by `.github/workflows/relock.yml`; reproduce locally with `task relock`.' \
            || true
      - name: Container diagnostics
        if: failure()
        uses: ./.github/actions/container-diagnostics
        with:
          compose: ${{ env.COMPOSE }}
