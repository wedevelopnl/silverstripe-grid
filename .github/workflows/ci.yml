name: CI

on:
  push:
    branches: ['6']
  pull_request:
    branches: ['6']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrictive default for every job; jobs that need more (e.g. publishing
# check runs) opt in explicitly via their own permissions block.
permissions:
  contents: read

jobs:
  js-qa:
    name: JavaScript QA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The E2E helpers typecheck against the Playwright client shipped inside
      # vendor/wedevelopnl/silverstripe-e2e, so composer deps must exist on the
      # runner (not just inside the Docker image).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
      - uses: ramsey/composer-install@v3
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run i18n:check
      # --coverage enforces the thresholds in vite.config.ts (statements 90,
      # branches 85, functions 90, lines 90) — without it the JS gate only
      # exists locally while PHP QA carries a CI-enforced 90% gate.
      - run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
      - name: Verify generated files are up to date
        # `npm run build` regenerates client/dist and (via i18n:collect) client/lang;
        # both are committed artifacts. `git diff` only sees tracked paths, so a
        # brand-new build output (a new chunk, .d.ts, or the compiled lang js for a
        # newly added locale) needs the explicit untracked check below.
        run: |
          npm run build
          git diff --exit-code -- client/dist client/lang
          untracked="$(git status --porcelain --untracked-files=all -- client/dist client/lang | grep '^??' || true)"
          if [ -n "$untracked" ]; then
            echo "Untracked generated files — the build produced outputs that are not committed:"
            echo "$untracked"
            exit 1
          fi
      - uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Vitest Results
          path: reports/vitest-junit.xml
          reporter: java-junit

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f .docker/compose.yml -f .docker/compose.ci.yml
      COMPOSE_BAKE: 'true'
      CACHE_SCOPE: app-php8.3
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      # Authenticate to Docker Hub to lift the anonymous pull rate limit
      # (~100 pulls/6h per shared runner IP) that can fail image pulls. Guarded
      # on the secret so fork/Dependabot PRs without secrets fall back to
      # anonymous pulls rather than erroring on empty credentials.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-docker-mirror
      - run: task docker-env
      - name: Build image (GHA layer cache)
        run: $COMPOSE build app
      - name: Start services
        run: $COMPOSE up -d --wait app
      - run: task analyse
      # Second PHPStan pass with the analysis target pinned to PHP 8.5. PHPStan gates
      # some checks on the target version rather than the runtime PHP (e.g. #[\NoDiscard],
      # which only fires at >= 8.5); the primary pass above keeps verifying the 8.3 floor.
      - run: task analyse-php85
      - run: task rector-dry

  php-qa:
    name: PHP QA (${{ matrix.variant }} / PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      # Explicit combinations: both variants run the full PHP matrix. The
      # Fluent variant runs all suites and owns the 90% coverage gate; the
      # base (non-Fluent) variant runs unit+integration+functional only, to
      # catch regressions that Fluent's extensions would otherwise mask.
      matrix:
        include:
          - { variant: fluent, php: '8.3', profile: '--profile fluent', service: app-fluent }
          - { variant: fluent, php: '8.4', profile: '--profile fluent', service: app-fluent }
          - { variant: fluent, php: '8.5', profile: '--profile fluent', service: app-fluent }
          - { variant: base, php: '8.3', profile: '', service: app }
          - { variant: base, php: '8.4', profile: '', service: app }
          - { variant: base, php: '8.5', profile: '', service: app }
    env:
      PHP_VERSION: ${{ matrix.php }}
      COMPOSE: docker compose -f .docker/compose.yml -f .docker/compose.ci.yml ${{ matrix.profile }}
      COMPOSE_BAKE: 'true'
      CACHE_SCOPE: ${{ matrix.service }}-php${{ matrix.php }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-docker-mirror
      - run: task docker-env
      - name: Build image (GHA layer cache)
        run: $COMPOSE build ${{ matrix.service }}
      - name: Start services
        run: $COMPOSE up -d --wait ${{ matrix.service }}
      # Base variant: non-Fluent suites only (mirrors `task test`), no coverage gate.
      - if: matrix.variant == 'base'
        name: Run tests (no Fluent)
        run: >-
          $COMPOSE exec ${{ matrix.service }} vendor/bin/phpunit
          --testsuite unit,integration,functional
          --log-junit coverage/junit.xml
      # Fluent variant: all suites with coverage + 90% threshold gate.
      - if: matrix.variant == 'fluent'
        name: Run all tests with coverage
        run: >-
          $COMPOSE exec ${{ matrix.service }} vendor/bin/phpunit
          --log-junit coverage/junit.xml
          --coverage-clover coverage/clover.xml
      - if: matrix.variant == 'fluent'
        name: Check coverage threshold (90%)
        run: $COMPOSE exec ${{ matrix.service }} vendor/bin/coverage-check coverage/clover.xml 90
      - uses: dorny/test-reporter@v3
        if: always()
        with:
          name: PHPUnit Results (${{ matrix.variant }} / PHP ${{ matrix.php }})
          path: coverage/junit.xml
          reporter: java-junit

  e2e:
    name: E2E (${{ matrix.browser }} / ${{ matrix.adapter }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        adapter: [bootstrap, tailwind]
        # Bulma is the behaviorally distinct preset (per-viewport hides, no
        # restore class, mobile-first 'desktop' default) and was previously
        # untested in E2E. One chromium job suffices: adapter class generation
        # is browser-independent, and the cross product above already covers
        # browser behavior.
        include:
          - { browser: chromium, adapter: bulma }
    env:
      SS_GRID_ADAPTER: ${{ matrix.adapter }}
      COMPOSE: docker compose -f .docker/compose.yml -f .docker/compose.ci.yml
      COMPOSE_BAKE: 'true'
      CACHE_SCOPE: app-php8.3
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Playwright runs on the runner and imports the fixture client from
      # vendor/wedevelopnl/silverstripe-e2e, so composer deps must exist on the
      # runner (the Docker image's vendor volume is not visible to the host).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
      - uses: ramsey/composer-install@v3
      - run: npm ci
      - uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      # On a cache hit the browser binaries are already restored, so install
      # without --with-deps to skip the ~24s apt-get of system libraries. On a
      # miss, do the full install (download browser + system deps). Trade-off:
      # if the runner image ever drops a required lib, browser launch fails
      # loudly (not flakily) until the next cache miss reinstalls deps.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install ${{ matrix.browser }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/cache/save@v6
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - uses: ./.github/actions/setup-docker-mirror
      - run: task docker-env
      - name: Build image (GHA layer cache)
        run: $COMPOSE build app
      - name: Start services
        run: $COMPOSE up -d --wait app
      - name: Run Playwright
        run: npx playwright test --project=${{ matrix.browser }} --reporter=html,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/playwright-junit.xml
      - uses: dorny/test-reporter@v3
        if: always()
        with:
          name: E2E Results (${{ matrix.browser }} / ${{ matrix.adapter }})
          path: reports/playwright-junit.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.adapter }}
          path: playwright-report/
          retention-days: 7
