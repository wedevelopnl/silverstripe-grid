name: CI

on:
  push:
    branches: ['6']
  pull_request:
    branches: ['6']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-qa:
    name: JavaScript QA
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Results
          path: reports/vitest-junit.xml
          reporter: java-junit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f .docker/compose.yml
    steps:
      - uses: actions/checkout@v4
      - run: make .docker/.env
      - run: $COMPOSE up -d --build --wait app
        name: Start services
      - run: make analyse

  php-qa:
    name: PHP QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      checks: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    env:
      PHP_VERSION: ${{ matrix.php }}
      COMPOSE: docker compose -f .docker/compose.yml --profile fluent
    steps:
      - uses: actions/checkout@v4
      - run: make .docker/.env
      - run: $COMPOSE up -d --build --wait
        name: Start services
      - run: >-
          $COMPOSE exec app-fluent vendor/bin/phpunit
          --log-junit coverage/junit.xml
          --coverage-clover coverage/clover.xml
        name: Run all tests with coverage
      - run: $COMPOSE exec app-fluent vendor/bin/coverage-check coverage/clover.xml 90
        name: Check coverage threshold (90%)
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: PHPUnit Results (PHP ${{ matrix.php }})
          path: coverage/junit.xml
          reporter: java-junit

  e2e:
    name: E2E (${{ matrix.browser }} / ${{ matrix.adapter }})
    runs-on: ubuntu-latest
    permissions:
      checks: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        adapter: [bootstrap, tailwind]
    env:
      SS_GRID_ADAPTER: ${{ matrix.adapter }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/cache/save@v4
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: make .docker/.env
      - run: make ensure-up
      - name: Run Playwright
        run: npx playwright test --project=${{ matrix.browser }} --reporter=html,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/playwright-junit.xml
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Results (${{ matrix.browser }} / ${{ matrix.adapter }})
          path: reports/playwright-junit.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.adapter }}
          path: playwright-report/
          retention-days: 7
