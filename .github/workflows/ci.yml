name: CI

on:
  push:
    branches: ['6']
  pull_request:
    branches: ['6']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-qa:
    name: JavaScript QA
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Vitest Results
          path: reports/vitest-junit.xml
          reporter: java-junit

  php-qa:
    name: PHP QA (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      checks: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    env:
      PHP_VERSION: ${{ matrix.php }}
      COMPOSE: docker compose -f .docker/compose.yml
    steps:
      - uses: actions/checkout@v4
      - run: make ensure-up
      - run: make analyse
      - run: $COMPOSE exec app vendor/bin/phpunit --testsuite unit --log-junit coverage/junit-unit.xml
        name: Unit tests
      - run: $COMPOSE exec app vendor/bin/phpunit --testsuite integration --log-junit coverage/junit-integration.xml
        name: Integration tests
      - run: $COMPOSE exec app vendor/bin/phpunit --testsuite functional --log-junit coverage/junit-functional.xml
        name: Functional tests
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: PHPUnit Results (PHP ${{ matrix.php }})
          path: coverage/junit-*.xml
          reporter: java-junit

  php-coverage:
    name: PHP Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make coverage-check

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    permissions:
      checks: write
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: make ensure-up
      - run: npx playwright test --project=${{ matrix.browser }} --reporter=html,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: reports/playwright-junit.xml
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: E2E Results (${{ matrix.browser }})
          path: reports/playwright-junit.xml
          reporter: java-junit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 7
