version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    # Peer-locked families must move as a unit. Ungrouped, Dependabot opens one
    # PR per package, and each is unresolvable on its own: bumping
    # @stryker-mutator/vitest-runner to 10.0.0 against a tree still holding
    # @stryker-mutator/core@9.6.1 fails `npm ci` with ERESOLVE before a single
    # test runs. That happened to 18 jobs in one day; re-running cannot fix it,
    # because nothing about it is flaky.
    #
    # Each group below is a set whose members peer-depend on each other's exact
    # version. Anything not listed keeps getting its own PR, which is what we
    # want for independently versioned packages.
    groups:
      stryker:
        patterns:
          - "@stryker-mutator/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      testing-library:
        patterns:
          - "@testing-library/*"
      dnd-kit:
        patterns:
          - "@dnd-kit/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
    ignore:
      # react / react-dom are externalized to silverstripe/admin's runtime
      # React global (see vite.config.ts) — the CMS provides React at runtime,
      # so this module must match admin's version. admin ^3.0 ships React 18;
      # a major bump here builds the editor against a React the host doesn't
      # provide and breaks every mount. Drop these ignores once admin ships
      # React 19. The @types packages are pinned for the same reason: their
      # major must track the runtime React, not lead it.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

      # TypeScript 7 is released but this module does not support it yet.
      # Hold on the 6.x line until the toolchain (Biome, vite-plugin-dts,
      # @stryker-mutator/typescript-checker) and our own type-level code are
      # verified against it. Drop this ignore as part of the TS 7 migration.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

      # Biome 2.5.6 regresses the type inference 2.5.5 fixed. nursery/
      # useAwaitThenable (an error here, biome.json) flags all ten
      # `await act(async () => …)` calls in useElementMutations.test.tsx as
      # awaiting a non-Promise — but React's `act` returns a custom Thenable,
      # exactly the case Biome's own diagnostic warns not to "fix" by dropping
      # the await. suspicious/noUnnecessaryConditions (warn, non-blocking) also
      # flips back to calling the `?? []` / `?? 0` fallbacks unreachable,
      # undoing the suppression cleanup done for 2.5.5. Both would need
      # suppressions that a corrected patch release turns straight back into
      # dead code. Held at 2.5.5; drop this entry once a release lints clean.
      - dependency-name: "@biomejs/biome"
        versions: ["2.5.6"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /.docker
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
