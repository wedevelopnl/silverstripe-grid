version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    ignore:
      # react / react-dom are externalized to silverstripe/admin's runtime
      # React global (see vite.config.ts) — the CMS provides React at runtime,
      # so this module must match admin's version. admin ^3.0 ships React 18;
      # a major bump here builds the editor against a React the host doesn't
      # provide and breaks every mount. Drop these ignores once admin ships
      # React 19. The @types packages are pinned for the same reason: their
      # major must track the runtime React, not lead it.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

      # TypeScript 7 is released but this module does not support it yet.
      # Hold on the 6.x line until the toolchain (Biome, vite-plugin-dts,
      # @stryker-mutator/typescript-checker) and our own type-level code are
      # verified against it. Drop this ignore as part of the TS 7 migration.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

      # Biome 2.5.3 panics ("index out of bounds") while linting our .tsx and
      # E2E spec files. The fault is in its shared type-inference machinery, not
      # a single rule: a11y/correctness/performance/security lint clean, while
      # complexity/suspicious/nursery/style all panic on the same files. Held at
      # 2.5.2 until a fixed release lands; drop this entry when one does.
      - dependency-name: "@biomejs/biome"
        versions: ["2.5.3"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: docker
    directory: /.docker
    schedule:
      interval: weekly
