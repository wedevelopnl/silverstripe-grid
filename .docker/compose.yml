services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
    ports:
      # Loopback only: SS_ENVIRONMENT_TYPE is dev, so the whole unauthenticated
      # /dev/* surface is live. Docker publishes on 0.0.0.0 by default and its
      # iptables rules bypass most host firewalls, which would expose that
      # surface to any shared network the developer is on.
      - "127.0.0.1:${WEB_PORT}:443"
    volumes:
      - ../composer.json:/module/composer.json:ro
      - ../src:/module/src
      - ../tests:/module/tests:ro
      - ../_config:/module/_config:ro
      - ../phpstan:/module/phpstan:ro
      - ../client/dist:/module/client/dist:ro
      - ../client/js:/module/client/js:ro
      - ../client/lang:/module/client/lang:ro
      - ../client/images:/module/client/images:ro
      - ../lang:/module/lang
      - ../templates:/module/templates:ro
      - ../coverage:/app/coverage
      - vendor:/app/vendor
    # A crash mid-suite used to cost the entire remaining E2E run: the process
    # dies, every later spec fails on ECONNREFUSED, and the job reports 25
    # failures for one fault. Bring it back so the cost is bounded by how long a
    # boot takes. Capped at three so a container that cannot start still fails
    # the job promptly instead of looping until the step times out.
    restart: on-failure:3
    healthcheck:
      # Both halves are needed. The marker says the bootstrap finished; the curl
      # says frankenphp is actually accepting connections. The entrypoint writes
      # the marker and then `exec`s the server, so the marker alone reports
      # healthy while the port is still closed — `up --wait` returns, CI starts
      # the browser, and the first navigation gets ERR_CONNECTION_CLOSED while
      # Caddy is still issuing its local certificate.
      test: test -f /tmp/.app-ready && curl -sSk -o /dev/null https://localhost/
      interval: 3s
      start_period: 60s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
    environment:
      SS_DATABASE_SERVER: db
      SS_DATABASE_NAME: silverstripe
      SS_DATABASE_USERNAME: silverstripe
      SS_DATABASE_PASSWORD: silverstripe
      SS_DEFAULT_ADMIN_USERNAME: admin
      SS_DEFAULT_ADMIN_PASSWORD: admin
      SS_ENVIRONMENT_TYPE: dev
      SS_PHPUNIT_FLUSH: 1
      SS_GRID_ADAPTER: ${SS_GRID_ADAPTER}

  app-fluent:
    profiles: [fluent]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        COMPOSER_FILE: app/composer.fluent.json
        COMPOSER_LOCK: app/composer.fluent.lock
    volumes:
      - ../composer.json:/module/composer.json:ro
      - ../src:/module/src
      - ../tests:/module/tests:ro
      - ../_config:/module/_config:ro
      - ../phpstan:/module/phpstan:ro
      - ../client/dist:/module/client/dist:ro
      - ../client/js:/module/client/js:ro
      - ../client/lang:/module/client/lang:ro
      - ../client/images:/module/client/images:ro
      - ../lang:/module/lang
      - ../templates:/module/templates:ro
      - ../coverage:/app/coverage
      - vendor-fluent:/app/vendor
    # Rationale on the `app` service above.
    restart: on-failure:3
    healthcheck:
      # Rationale on the `app` service above.
      test: test -f /tmp/.app-ready && curl -sSk -o /dev/null https://localhost/
      interval: 3s
      start_period: 60s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
    environment:
      SS_DATABASE_SERVER: db
      SS_DATABASE_NAME: silverstripe_fluent
      SS_DATABASE_USERNAME: silverstripe
      SS_DATABASE_PASSWORD: silverstripe
      SS_DEFAULT_ADMIN_USERNAME: admin
      SS_DEFAULT_ADMIN_PASSWORD: admin
      SS_ENVIRONMENT_TYPE: dev
      SS_PHPUNIT_FLUSH: 1
      SS_GRID_ADAPTER: ${SS_GRID_ADAPTER}

  db:
    image: mysql:8
    ports:
      # Loopback only — the credentials below are fixed dev defaults, so this
      # port must never be reachable from off-host. The app reaches the database
      # over the compose network, not through this published port.
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_DATABASE: silverstripe
      MYSQL_USER: silverstripe
      MYSQL_PASSWORD: silverstripe
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: mysqladmin ping -h localhost
      interval: 5s
      retries: 10

volumes:
  vendor:
  vendor-fluent:
  db-data:
