version: '3'

# Build/dev task runner for the SilverStripe Grid module.
# Replaces the former Makefile. Install Task: https://taskfile.dev/installation
#
# Output note: Task runs parallel `deps` with interleaved output (no global
# `output: group`) so the interactive `docker compose exec` tasks keep their TTY.
# The `qa-*` tasks print `==> [name] ...` markers so parallel QA stays followable.

vars:
  COMPOSE: docker compose -f .docker/compose.yml
  COMPOSE_FLUENT: docker compose -f .docker/compose.yml --profile fluent

tasks:
  # --- Docker environment ---------------------------------------------------

  docker-env:
    desc: Generate .docker/.env with deterministic ports (only if missing)
    cmds:
      - .docker/env.sh
    status:
      - test -f .docker/.env

  up:
    desc: Start services (build if needed)
    deps: [docker-env]
    cmds:
      - "{{.COMPOSE}} up -d --build"
      - 'port=$(grep WEB_PORT .docker/.env | cut -d= -f2); printf "\n  Testbed running at \033]8;;https://localhost:%s\ahttps://localhost:%s\033]8;;\a\n\n" "$port" "$port"'

  down:
    desc: Stop services
    cmds:
      - "{{.COMPOSE}} down"

  destroy:
    desc: Stop services and remove volumes
    cmds:
      - "{{.COMPOSE}} down -v"

  build:
    desc: Build images without starting
    cmds:
      - "{{.COMPOSE}} build"

  ensure-up:
    desc: Ensure services are running and ready
    cmds:
      - "{{.COMPOSE}} exec app true 2>/dev/null || {{.COMPOSE}} up -d --build --wait"

  ensure-up-fluent:
    desc: Ensure Fluent services are running and ready
    deps: [docker-env]
    cmds:
      - "{{.COMPOSE_FLUENT}} exec app-fluent true 2>/dev/null || {{.COMPOSE_FLUENT}} up -d --build --wait"

  # --- Tests ----------------------------------------------------------------

  test:
    desc: Run all tests (PHP unit + integration + functional + JS)
    deps: [ensure-up]
    # Sequential: the PHP suites share the app DB container and would race in parallel.
    cmds:
      - task: test-unit
      - task: test-integration
      - task: test-functional
      - task: test-js

  test-unit:
    desc: Run PHP unit tests (no database or framework)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/phpunit --testsuite unit"

  test-integration:
    desc: Run PHP integration tests (full SilverStripe environment)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/phpunit --testsuite integration"

  test-functional:
    desc: Run PHP functional tests (HTTP/controller tests)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/phpunit --testsuite functional"

  test-fluent:
    desc: Run integration + functional + fluent tests in Fluent environment
    deps: [ensure-up-fluent]
    cmds:
      - "{{.COMPOSE_FLUENT}} exec app-fluent vendor/bin/phpunit --testsuite integration,functional,fluent"

  test-js:
    desc: Run JavaScript tests (Vitest)
    cmds:
      - npm run test

  test-e2e:
    desc: Run E2E tests (Playwright, requires running Docker services)
    deps: [ensure-up]
    cmds:
      - npx playwright test

  test-e2e-ui:
    desc: Run E2E tests with interactive UI
    deps: [ensure-up]
    interactive: true
    cmds:
      - npx playwright test --ui

  # --- Coverage -------------------------------------------------------------

  coverage:
    desc: Run all tests with merged coverage (HTML + Clover XML)
    deps: [ensure-up-fluent]
    cmds:
      - >-
        {{.COMPOSE_FLUENT}} exec app-fluent vendor/bin/phpunit
        --coverage-html coverage/combined/html
        --coverage-clover coverage/combined/clover.xml

  coverage-unit:
    desc: Run unit tests with coverage (individual report)
    deps: [ensure-up]
    cmds:
      - >-
        {{.COMPOSE}} exec app vendor/bin/phpunit --testsuite unit
        --coverage-html coverage/unit/html
        --coverage-clover coverage/unit/clover.xml

  coverage-integration:
    desc: Run integration tests with coverage (individual report)
    deps: [ensure-up-fluent]
    cmds:
      - >-
        {{.COMPOSE_FLUENT}} exec app-fluent vendor/bin/phpunit --testsuite integration,fluent
        --coverage-html coverage/integration/html
        --coverage-clover coverage/integration/clover.xml

  coverage-functional:
    desc: Run functional tests with coverage (individual report)
    deps: [ensure-up]
    cmds:
      - >-
        {{.COMPOSE}} exec app vendor/bin/phpunit --testsuite functional
        --coverage-html coverage/functional/html
        --coverage-clover coverage/functional/clover.xml

  coverage-js:
    desc: Run JavaScript tests with coverage
    cmds:
      - npm run coverage

  coverage-check:
    desc: Check PHP coverage meets minimum threshold (90%)
    deps: [coverage]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/coverage-check coverage/combined/clover.xml 90"

  # --- Mutation testing -----------------------------------------------------

  mutate:
    desc: Run PHP mutation testing (Infection) — uses Fluent container so all tests run
    deps: [ensure-up-fluent]
    cmds:
      - "{{.COMPOSE_FLUENT}} exec app-fluent php -d memory_limit=1G vendor/bin/infection --threads=4"

  mutate-js:
    desc: Run JavaScript mutation testing (Stryker)
    cmds:
      - npm run mutate

  # --- Static analysis ------------------------------------------------------

  analyse:
    desc: Run PHPStan static analysis
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=512M"

  analyse-php85:
    desc: Run PHPStan with the analysis target pinned to PHP 8.5 (in addition to the 8.3-range primary pass)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/phpstan analyse -c phpstan-php85.neon.dist --memory-limit=512M"

  rector:
    desc: Run Rector refactoring (applies changes)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/rector process"

  rector-dry:
    desc: Run Rector in dry-run mode (preview only)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/rector process --dry-run"

  # --- SilverStripe helpers -------------------------------------------------

  flush:
    desc: Clear SilverStripe cache
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/sake flush"

  dev-build:
    desc: Run dev/build to rebuild the database and manifest
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/sake dev/build flush=1"

  seed-fixture:
    desc: Seed the dev database with an E2E fixture (override with FIXTURE=<name>; default complex-page)
    # Hits the same dev-only endpoint the Playwright suite uses. Loading is
    # idempotent: the loader archives previously-seeded e2e-* pages first, so a
    # re-run (or switching FIXTURE) never stacks residue. Fixture names are
    # registered in _config/dev.yml under FixtureLoader.fixtures. -k because the
    # dev testbed serves a self-signed certificate.
    deps: [ensure-up]
    vars:
      FIXTURE: '{{.FIXTURE | default "complex-page"}}'
    cmds:
      - 'echo "==> [seed] loading fixture: {{.FIXTURE}}"'
      - >-
        curl -sS -k --fail-with-body -X POST
        -d "fixture={{.FIXTURE}}"
        "https://localhost:$(grep WEB_PORT .docker/.env | cut -d= -f2)/dev/e2e-fixtures/load"
      - 'printf "\n\n==> [seed] done — open https://localhost:%s/admin/pages\n\n" "$(grep WEB_PORT .docker/.env | cut -d= -f2)"'

  # --- QA -------------------------------------------------------------------

  qa:
    desc: Run full QA suite (all checks in parallel)
    deps: [ensure-up, ensure-up-fluent]
    cmds:
      - task: qa-checks

  qa-js:
    desc: Run JavaScript QA (lint + format + typecheck + test + build, in parallel)
    deps:
      - qa-lint
      - qa-format
      - qa-typecheck
      - qa-test-js
      - qa-build

  # Internal QA orchestration + sub-tasks (not intended to be called directly).

  qa-checks:
    internal: true
    deps:
      - qa-analyse
      - qa-analyse-php85
      - qa-rector
      - qa-coverage
      - qa-lint
      - qa-format
      - qa-typecheck
      - qa-test-js
      - qa-build

  qa-analyse:
    internal: true
    cmds:
      - 'echo "==> [analyse] running PHPStan..."'
      - "{{.COMPOSE}} exec -T app vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=512M"
      - 'echo "==> [analyse] done"'

  qa-analyse-php85:
    internal: true
    cmds:
      - 'echo "==> [analyse-php85] running PHPStan (PHP 8.5 analysis target)..."'
      - "{{.COMPOSE}} exec -T app vendor/bin/phpstan analyse -c phpstan-php85.neon.dist --memory-limit=512M"
      - 'echo "==> [analyse-php85] done"'

  qa-rector:
    internal: true
    cmds:
      - 'echo "==> [rector] running Rector (dry-run)..."'
      - "{{.COMPOSE}} exec -T app vendor/bin/rector process --dry-run --no-progress-bar"
      - 'echo "==> [rector] done"'

  qa-coverage:
    internal: true
    cmds:
      - 'echo "==> [coverage] running PHPUnit with coverage (slow, several minutes)..."'
      - >-
        {{.COMPOSE_FLUENT}} exec -T app-fluent vendor/bin/phpunit
        --coverage-html coverage/combined/html
        --coverage-clover coverage/combined/clover.xml
      - "{{.COMPOSE_FLUENT}} exec -T app-fluent vendor/bin/coverage-check coverage/combined/clover.xml 90"
      - 'echo "==> [coverage] done"'

  qa-lint:
    internal: true
    cmds:
      - 'echo "==> [lint] running Biome + Stylelint..."'
      - npm run lint
      - 'echo "==> [lint] done"'

  qa-format:
    internal: true
    cmds:
      - 'echo "==> [format] running Biome format check..."'
      - npm run format:check
      - 'echo "==> [format] done"'

  qa-typecheck:
    internal: true
    cmds:
      - 'echo "==> [typecheck] running tsc..."'
      - npm run typecheck
      - 'echo "==> [typecheck] done"'

  qa-test-js:
    internal: true
    cmds:
      - 'echo "==> [test-js] running Vitest..."'
      - npm run test
      - 'echo "==> [test-js] done"'

  qa-build:
    internal: true
    cmds:
      - 'echo "==> [build] running vite build..."'
      - npx vite build
      - 'echo "==> [build] done"'
