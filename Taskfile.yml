version: '3'

# Build/dev task runner for the SilverStripe Grid module.
# Replaces the former Makefile. Install Task: https://taskfile.dev/installation
#
# Output note: Task runs parallel `deps` with interleaved output (no global
# `output: group`) so the interactive `docker compose exec` tasks keep their TTY.
# The `qa-*` tasks print `==> [name] ...` markers so parallel QA stays followable.

vars:
  COMPOSE: docker compose -f .docker/compose.yml
  COMPOSE_MODULES: docker compose -f .docker/compose.yml --profile modules
  # class-leak only parses PHP, so every class SilverStripe reaches by config
  # (YAML) or by type (manifest discovery) reads as unused. The first five skip
  # those by parent type; the next four are YAML-only Injector bindings with no
  # such parent. src/AdminToolbar is skipped by path: the toolbar discovers its
  # Components by type, and it is not installed here to resolve that type. Skip
  # types are resolved with is_a(), so this must run where the framework
  # autoloads — inside the container.
  CLASS_LEAK: >-
    vendor/bin/class-leak check /module/src
    --skip-type='SilverStripe\Admin\AdminController'
    --skip-type='SilverStripe\Core\Extension'
    --skip-type='SilverStripe\Core\Injector\Factory'
    --skip-type='SilverStripe\Dev\BuildTask'
    --skip-type='SilverStripe\Reports\Report'
    --skip-type='WeDevelop\Grid\Forms\GridAwareVersionFormFactory'
    --skip-type='WeDevelop\Grid\Model\MediaElement'
    --skip-type='WeDevelop\Grid\Service\GridAwareDeleteLocalisationPolicy'
    --skip-type='WeDevelop\Grid\Validation\HierarchyValidationService'
    --skip-path='/module/src/AdminToolbar'

tasks:
  # --- Docker environment ---------------------------------------------------

  docker-env:
    desc: Generate .docker/.env with deterministic ports (only if missing or outdated)
    cmds:
      - .docker/env.sh
    # The grep regenerates a file that predates the modules testbed's port;
    # env.sh keeps the SS_GRID_ADAPTER already in it.
    status:
      - test -f .docker/.env
      - grep -q '^MODULES_WEB_PORT=' .docker/.env

  up:
    desc: Start services (build if needed)
    deps: [docker-env]
    cmds:
      - "{{.COMPOSE}} up -d --build"
      - task: print-url
        vars: { LABEL: Testbed, PORT_KEY: WEB_PORT }

  up-modules:
    desc: Start the optional-modules testbed (Fluent + userforms installed) next to the base one
    deps: [docker-env]
    # Names its service for the reason given above ensure-up.
    cmds:
      - "{{.COMPOSE_MODULES}} up -d --build --wait app-modules"
      - task: print-url
        vars: { LABEL: Optional-modules testbed, PORT_KEY: MODULES_WEB_PORT }

  print-url:
    internal: true
    cmds:
      - 'port=$(grep "^{{.PORT_KEY}}=" .docker/.env | cut -d= -f2); printf "\n  {{.LABEL}} running at \033]8;;https://localhost:%s\ahttps://localhost:%s\033]8;;\a\n\n" "$port" "$port"'

  down:
    desc: Stop services
    deps: [docker-env]
    cmds:
      - "{{.COMPOSE_MODULES}} down"

  destroy:
    desc: Stop services and remove volumes
    deps: [docker-env]
    cmds:
      - "{{.COMPOSE_MODULES}} down -v"

  build:
    desc: Build images without starting
    deps: [docker-env]
    cmds:
      - "{{.COMPOSE}} build"

  # Both name their service. Without it the bare `up` brings the WHOLE profile
  # up with --build, so `ensure-up-modules` recreates the `app` container that
  # `ensure-up` just declared ready — and any `exec app` running concurrently
  # (`task qa` starts four) dies with exit 1 and no output. depends_on still
  # brings db up either way.
  ensure-up:
    desc: Ensure services are running and ready
    deps: [docker-env]
    cmds:
      - "{{.COMPOSE}} exec app true 2>/dev/null || {{.COMPOSE}} up -d --build --wait app"

  ensure-up-modules:
    desc: Ensure optional-module services are running and ready
    deps: [docker-env]
    cmds:
      - "{{.COMPOSE_MODULES}} exec app-modules true 2>/dev/null || {{.COMPOSE_MODULES}} up -d --build --wait app-modules"

  # --- Tests ----------------------------------------------------------------

  test:
    desc: Run all tests (PHP unit + integration + functional + JS)
    deps: [ensure-up]
    # Sequential: the PHP suites share the app DB container and would race in parallel.
    cmds:
      - task: test-unit
      - task: test-integration
      - task: test-functional
      - task: test-js

  test-unit:
    desc: Run PHP unit tests (no database or framework)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/phpunit --testsuite unit"

  test-integration:
    desc: Run PHP integration tests (full SilverStripe environment)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/phpunit --testsuite integration"

  test-functional:
    desc: Run PHP functional tests (HTTP/controller tests)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/phpunit --testsuite functional"

  test-modules:
    desc: Run integration + functional + fluent + userforms + admintoolbar tests in the optional-modules environment
    deps: [ensure-up-modules]
    cmds:
      - "{{.COMPOSE_MODULES}} exec app-modules vendor/bin/phpunit --testsuite integration,functional,fluent,userforms,admintoolbar"

  test-js:
    desc: Run JavaScript tests (Vitest)
    cmds:
      - npm run test

  test-e2e:
    desc: Run E2E tests (Playwright, requires running Docker services)
    deps: [ensure-up]
    cmds:
      - npx playwright test

  test-e2e-modules:
    desc: Run E2E tests against the optional-modules testbed (Playwright; wipes that testbed's pages and blocks)
    deps: [ensure-up-modules]
    cmds:
      - npx playwright test --config playwright.modules.config.ts

  test-e2e-ui:
    desc: Run E2E tests with interactive UI
    deps: [ensure-up]
    interactive: true
    cmds:
      - npx playwright test --ui

  # --- Coverage -------------------------------------------------------------

  coverage:
    desc: Run all tests with merged coverage (HTML + Clover XML)
    deps: [ensure-up-modules]
    cmds:
      - >-
        {{.COMPOSE_MODULES}} exec app-modules vendor/bin/phpunit
        --coverage-html coverage/combined/html
        --coverage-clover coverage/combined/clover.xml

  coverage-unit:
    desc: Run unit tests with coverage (individual report)
    deps: [ensure-up]
    cmds:
      - >-
        {{.COMPOSE}} exec app vendor/bin/phpunit --testsuite unit
        --coverage-html coverage/unit/html
        --coverage-clover coverage/unit/clover.xml

  coverage-integration:
    desc: Run integration tests with coverage (individual report)
    deps: [ensure-up-modules]
    cmds:
      - >-
        {{.COMPOSE_MODULES}} exec app-modules vendor/bin/phpunit --testsuite integration,fluent,userforms,admintoolbar
        --coverage-html coverage/integration/html
        --coverage-clover coverage/integration/clover.xml

  coverage-functional:
    desc: Run functional tests with coverage (individual report)
    deps: [ensure-up]
    cmds:
      - >-
        {{.COMPOSE}} exec app vendor/bin/phpunit --testsuite functional
        --coverage-html coverage/functional/html
        --coverage-clover coverage/functional/clover.xml

  coverage-js:
    desc: Run JavaScript tests with coverage
    cmds:
      - npm run coverage

  coverage-check:
    desc: Check PHP coverage meets minimum threshold (90%)
    deps: [coverage]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/coverage-check coverage/combined/clover.xml 90"

  # --- Mutation testing -----------------------------------------------------

  mutate:
    desc: Run PHP mutation testing (Infection) — uses the optional-modules container so all tests run
    deps: [ensure-up-modules]
    cmds:
      - "{{.COMPOSE_MODULES}} exec app-modules php -d memory_limit=1G vendor/bin/infection --threads=4"

  mutate-js:
    desc: Run JavaScript mutation testing (Stryker)
    cmds:
      - npm run mutate

  # --- Dependency lock ------------------------------------------------------

  relock:
    desc: Regenerate the container composer locks (both variants) and follow SS6.x
    deps: [docker-env]
    # Resolution happens inside the built image so the platform (PHP version and
    # extension set) matches what will run the tests. The image COPYs the locks,
    # so both files must exist for the build to succeed — recreate them from git
    # rather than deleting them if one is ever damaged.
    cmds:
      - "{{.COMPOSE_MODULES}} build app app-modules"
      - task: relock-variant
        vars: { SERVICE: app, LOCK: composer.lock }
      - task: relock-variant
        vars: { SERVICE: app-modules, LOCK: composer.modules.lock }

  relock-variant:
    internal: true
    # --entrypoint sh bypasses the boot install: the lock we are about to write
    # is the one it would install from. -v mounts the destination because the
    # lock has to reach the host, and composer's own output owns stdout.
    cmds:
      - >-
        {{.COMPOSE_MODULES}} run --rm --no-deps -T
        -v "$PWD/.docker/app:/lock"
        --entrypoint sh {{.SERVICE}}
        -c "composer update --no-install --no-scripts --no-interaction && cp composer.lock /lock/{{.LOCK}}"

  verify-lock:
    desc: Fail if the committed lock no longer covers the module's requirements
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app /app/verify-lock.sh"

  # --- Static analysis ------------------------------------------------------

  analyse:
    desc: Run PHPStan static analysis
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=512M"

  analyse-php85:
    desc: Run PHPStan with the analysis target pinned to PHP 8.5 (in addition to the 8.3-range primary pass)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/phpstan analyse -c phpstan-php85.neon.dist --memory-limit=512M"

  rector:
    desc: Run Rector refactoring (applies changes)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/rector process"

  rector-dry:
    desc: Run Rector in dry-run mode (preview only)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/rector process --dry-run"

  class-leak:
    desc: Find classes in src/ that nothing references (class-leak)
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app {{.CLASS_LEAK}}"

  # --- SilverStripe helpers -------------------------------------------------

  flush:
    desc: Clear SilverStripe cache
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/sake flush"

  flush-modules:
    desc: Clear the optional-modules testbed's SilverStripe cache
    deps: [ensure-up-modules]
    cmds:
      - "{{.COMPOSE_MODULES}} exec app-modules vendor/bin/sake flush"

  dev-build:
    desc: Run dev/build to rebuild the database and manifest
    deps: [ensure-up]
    cmds:
      - "{{.COMPOSE}} exec app vendor/bin/sake dev/build flush=1"

  dev-build-modules:
    desc: Run dev/build in the optional-modules testbed
    deps: [ensure-up-modules]
    cmds:
      - "{{.COMPOSE_MODULES}} exec app-modules vendor/bin/sake dev/build flush=1"

  seed-fixture:
    desc: Seed the dev database with an E2E fixture (override with FIXTURE=<name>; default complex-page)
    deps: [ensure-up]
    cmds:
      - task: seed
        vars: { PORT_KEY: WEB_PORT }

  seed-fixture-modules:
    desc: Seed the optional-modules testbed's database with an E2E fixture (FIXTURE=<name>; default complex-page)
    deps: [ensure-up-modules]
    cmds:
      - task: seed
        vars: { PORT_KEY: MODULES_WEB_PORT }

  seed:
    internal: true
    # Hits the same dev-only endpoint the Playwright suite uses. Loading is
    # idempotent: the loader archives previously-seeded e2e-* pages first, so a
    # re-run (or switching FIXTURE) never stacks residue. Fixture names are
    # registered in _config/dev.yml under FixtureLoader.fixtures. -k because the
    # dev testbed serves a self-signed certificate. The key is anchored because
    # WEB_PORT is a suffix of MODULES_WEB_PORT.
    vars:
      FIXTURE: '{{.FIXTURE | default "complex-page"}}'
      PORT:
        sh: grep "^{{.PORT_KEY}}=" .docker/.env | cut -d= -f2
    cmds:
      - 'echo "==> [seed] loading fixture: {{.FIXTURE}}"'
      - >-
        curl -sS -k --fail-with-body -X POST
        -d "fixture={{.FIXTURE}}"
        "https://localhost:{{.PORT}}/dev/e2e-fixtures/load"
      - 'printf "\n\n==> [seed] done — open https://localhost:%s/admin/pages\n\n" "{{.PORT}}"'

  # --- QA -------------------------------------------------------------------

  qa:
    desc: Run full QA suite (all checks in parallel)
    # The two bring-ups are cmds, not deps: Task runs deps concurrently, and both
    # of these create the shared `db` container, so from a cold start they race
    # and one loses with "container name already in use". They are near-instant
    # once the services are up, so serialising them costs nothing.
    deps: [docker-env]
    cmds:
      - task: ensure-up
      - task: ensure-up-modules
      - task: qa-checks

  qa-js:
    desc: Run JavaScript QA (lint + format + typecheck + test + build, in parallel)
    deps:
      - qa-lint
      - qa-format
      - qa-typecheck
      - qa-test-js
      - qa-build

  # Internal QA orchestration + sub-tasks (not intended to be called directly).

  qa-checks:
    internal: true
    deps:
      - qa-analyse
      - qa-analyse-php85
      - qa-rector
      - qa-class-leak
      - qa-coverage
      - qa-lint
      - qa-format
      - qa-typecheck
      - qa-i18n
      - qa-icons
      - qa-test-js
      - qa-build

  qa-analyse:
    internal: true
    cmds:
      - 'echo "==> [analyse] running PHPStan..."'
      - "{{.COMPOSE}} exec -T app vendor/bin/phpstan analyse -c phpstan.neon.dist --memory-limit=512M"
      - 'echo "==> [analyse] done"'

  qa-analyse-php85:
    internal: true
    cmds:
      - 'echo "==> [analyse-php85] running PHPStan (PHP 8.5 analysis target)..."'
      - "{{.COMPOSE}} exec -T app vendor/bin/phpstan analyse -c phpstan-php85.neon.dist --memory-limit=512M"
      - 'echo "==> [analyse-php85] done"'

  qa-rector:
    internal: true
    cmds:
      - 'echo "==> [rector] running Rector (dry-run)..."'
      - "{{.COMPOSE}} exec -T app vendor/bin/rector process --dry-run --no-progress-bar"
      - 'echo "==> [rector] done"'

  qa-class-leak:
    internal: true
    cmds:
      - 'echo "==> [class-leak] checking for unreferenced classes..."'
      - "{{.COMPOSE}} exec -T app {{.CLASS_LEAK}}"
      - 'echo "==> [class-leak] done"'

  qa-coverage:
    internal: true
    cmds:
      - 'echo "==> [coverage] running PHPUnit with coverage (slow, several minutes)..."'
      - >-
        {{.COMPOSE_MODULES}} exec -T app-modules vendor/bin/phpunit
        --coverage-html coverage/combined/html
        --coverage-clover coverage/combined/clover.xml
      - "{{.COMPOSE_MODULES}} exec -T app-modules vendor/bin/coverage-check coverage/combined/clover.xml 90"
      - 'echo "==> [coverage] done"'

  qa-lint:
    internal: true
    cmds:
      - 'echo "==> [lint] running Biome..."'
      - npm run lint
      - 'echo "==> [lint] done"'

  qa-i18n:
    internal: true
    cmds:
      - 'echo "==> [i18n] checking collected strings + locale parity..."'
      - npm run i18n:check
      - 'echo "==> [i18n] done"'

  qa-icons:
    internal: true
    cmds:
      - 'echo "==> [icons] checking font-icon-* classes against the admin font..."'
      - npm run check:icons
      - 'echo "==> [icons] done"'

  qa-format:
    internal: true
    cmds:
      - 'echo "==> [format] running Biome format check..."'
      - npm run format:check
      - 'echo "==> [format] done"'

  qa-typecheck:
    internal: true
    cmds:
      - 'echo "==> [typecheck] running tsc..."'
      - npm run typecheck
      - 'echo "==> [typecheck] done"'

  qa-test-js:
    internal: true
    cmds:
      - 'echo "==> [test-js] running Vitest..."'
      - npm run test
      - 'echo "==> [test-js] done"'

  qa-build:
    internal: true
    cmds:
      - 'echo "==> [build] running vite build..."'
      - npx vite build
      - 'echo "==> [build] done"'
