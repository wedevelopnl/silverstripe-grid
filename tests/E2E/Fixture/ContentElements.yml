# E2E fixture for content element creation and editing flows.
#
# Structure:
#   Page → Section → Row → 2 Columns
#     Column 1: empty (tests add-to-empty flow)
#     Column 2: 2 ContentElement leaves (tests add-to-existing + edit link)
#
# Top-down ordering: parents before children. FixtureLoader suppresses auto-scaffolding.
# All pages use the 'e2e-' URLSegment prefix for cleanup identification.

Page:
  e2e_page:
    Title: 'E2E Content Elements Page'
    URLSegment: 'e2e-content-elements'

# --- Section (into page) ---
WeDevelop\Grid\Model\Section:
  content_section:
    Title: 'Content Section'
    ShowTitle: 1
    TitleTag: h3
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_page

# --- Row (into section) ---
WeDevelop\Grid\Model\Row:
  content_row:
    Title: 'Content Row'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.content_section

# --- Columns (into row) ---
WeDevelop\Grid\Model\Column:
  empty_col:
    Title: 'Empty Column'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.content_row
    GridSettings: '{"default":{"width":6,"offset":0,"visible":true},"overrides":{}}'
  populated_col:
    Title: 'Populated Column'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Row.content_row
    GridSettings: '{"default":{"width":6,"offset":0,"visible":true},"overrides":{}}'

# --- Leaves (into populated column) ---
WeDevelop\Grid\Model\ContentElement:
  existing_leaf1:
    Title: 'Existing Text Block'
    HTML: '<p>Text block body content</p>'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.populated_col
  existing_leaf2:
    Title: 'Existing Image Block'
    HTML: '<p>Image block body content</p>'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Column.populated_col
