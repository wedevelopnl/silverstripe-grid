# E2E fixture for cross-section row drop position tests.
#
# Structure:
#   Page (E2E Cross Section Drop):
#     Section Alpha (Sort: 1)
#       Row A1 (Sort: 1) — Col A1 — Block A1
#       Row A2 (Sort: 2) — Col A2 — Block A2
#       Row A3 (Sort: 3) — Col A3 — Block A3
#     Section Beta (Sort: 2)
#       Row B1 (Sort: 1) — Col B1 — Block B1
#       Row B2 (Sort: 2) — Col B2 — Block B2
#       Row B3 (Sort: 3) — Col B3 — Block B3
#
# Both sections have 3 rows each. Tests cover all drop positions
# (before first, between N and N+1, after last) in both directions.

Page:
  e2e_page:
    Title: 'E2E Cross Section Drop'
    URLSegment: 'e2e-cross-section-drop'

WeDevelop\Grid\Model\Section:
  section_alpha:
    Title: 'Section Alpha'
    ShowTitle: 1
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_page
  section_beta:
    Title: 'Section Beta'
    ShowTitle: 1
    Sort: 2
    Zone: main
    Parent: =>Page.e2e_page

WeDevelop\Grid\Model\Row:
  row_a1:
    Title: 'Row A1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section_alpha
  row_a2:
    Title: 'Row A2'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Section.section_alpha
  row_a3:
    Title: 'Row A3'
    Sort: 3
    Parent: =>WeDevelop\Grid\Model\Section.section_alpha
  row_b1:
    Title: 'Row B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section_beta
  row_b2:
    Title: 'Row B2'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Section.section_beta
  row_b3:
    Title: 'Row B3'
    Sort: 3
    Parent: =>WeDevelop\Grid\Model\Section.section_beta

WeDevelop\Grid\Model\Column:
  col_a1:
    Title: 'Column A1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_a1
    GridSettings: '{}'
  col_a2:
    Title: 'Column A2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_a2
    GridSettings: '{}'
  col_a3:
    Title: 'Column A3'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_a3
    GridSettings: '{}'
  col_b1:
    Title: 'Column B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_b1
    GridSettings: '{}'
  col_b2:
    Title: 'Column B2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_b2
    GridSettings: '{}'
  col_b3:
    Title: 'Column B3'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_b3
    GridSettings: '{}'

WeDevelop\Grid\Model\ContentElement:
  block_a1:
    Title: 'Block A1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a1
  block_a2:
    Title: 'Block A2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a2
  block_a3:
    Title: 'Block A3'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a3
  block_b1:
    Title: 'Block B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_b1
  block_b2:
    Title: 'Block B2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_b2
  block_b3:
    Title: 'Block B3'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_b3
