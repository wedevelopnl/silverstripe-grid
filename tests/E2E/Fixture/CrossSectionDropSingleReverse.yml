# E2E fixture for cross-section row drop — source depletion from below.
#
# Structure:
#   Page (E2E Cross Section Drop Single Reverse):
#     Section Alpha (Sort: 1)
#       Row A1 (Sort: 1) — Col A1 — Block A1
#       Row A2 (Sort: 2) — Col A2 — Block A2
#       Row A3 (Sort: 3) — Col A3 — Block A3
#     Section Beta (Sort: 2)
#       Row B1 (Sort: 1) — Col B1 — Block B1
#
# Beta has 1 row. Moving it upward into Alpha (after last) tests
# source depletion + after-last placement from below.

Page:
  e2e_page:
    Title: 'E2E Cross Section Drop Single Reverse'
    URLSegment: 'e2e-cross-section-drop-single-reverse'

WeDevelop\Grid\Model\Section:
  section_alpha:
    Title: 'Section Alpha'
    ShowTitle: 1
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_page
  section_beta:
    Title: 'Section Beta'
    ShowTitle: 1
    Sort: 2
    Zone: main
    Parent: =>Page.e2e_page

WeDevelop\Grid\Model\Row:
  row_a1:
    Title: 'Row A1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section_alpha
  row_a2:
    Title: 'Row A2'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Section.section_alpha
  row_a3:
    Title: 'Row A3'
    Sort: 3
    Parent: =>WeDevelop\Grid\Model\Section.section_alpha
  row_b1:
    Title: 'Row B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section_beta

WeDevelop\Grid\Model\Column:
  col_a1:
    Title: 'Column A1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_a1
    GridSettings: '{}'
  col_a2:
    Title: 'Column A2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_a2
    GridSettings: '{}'
  col_a3:
    Title: 'Column A3'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_a3
    GridSettings: '{}'
  col_b1:
    Title: 'Column B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_b1
    GridSettings: '{}'

WeDevelop\Grid\Model\ContentElement:
  block_a1:
    Title: 'Block A1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a1
  block_a2:
    Title: 'Block A2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a2
  block_a3:
    Title: 'Block A3'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a3
  block_b1:
    Title: 'Block B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_b1
