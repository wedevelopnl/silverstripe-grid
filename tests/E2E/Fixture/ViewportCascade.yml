# E2E fixture for viewport override-resolution tests.
#
# Structure:
#   Page (E2E Viewport Cascade Test Page):
#     Section
#       Row
#         Cascade Column — neutral baseline, full-width default, no overrides.
#
# The spec sets a non-default-viewport override through the UI at test time.
# Cascade vs. isolated resolution strategies are exhaustively covered by
# GridSettingsResolverTest at the unit level; this spec verifies the
# user-observable path (editor badges + viewport switcher) under the
# project's default isolated strategy.
#
# Top-down ordering: parents before children. Auto-scaffolding is
# suppressed by FixtureLoader.

Page:
  e2e_page:
    Title: 'E2E Viewport Cascade Test Page'
    URLSegment: 'e2e-viewport-cascade'

WeDevelop\Grid\Model\Section:
  section1:
    Title: 'Cascade Section'
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_page

WeDevelop\Grid\Model\Row:
  row1:
    Title: 'Cascade Row'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section1

WeDevelop\Grid\Model\Column:
  col1:
    Title: 'Cascade Column'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row1
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'
