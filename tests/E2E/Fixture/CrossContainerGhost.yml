# E2E fixture for cross-container ghost-sticking regression test.
#
# Structure:
#   Page (E2E Cross Container Ghost Test):
#     Section Alpha (Sort: 1)
#       Row Alpha-1 (Sort: 1)
#         Column A1 (Sort: 1) — Block A1
#       Row Alpha-2 (Sort: 2)
#         Column A2 (Sort: 1) — Block A2
#     Section Beta (Sort: 2)
#       Row Beta-1 (Sort: 1)
#         Column B1 (Sort: 1) — Block B1

Page:
  e2e_page:
    Title: 'E2E Cross Container Ghost Test'
    URLSegment: 'e2e-cross-container-ghost'

WeDevelop\Grid\Model\Section:
  section_alpha:
    Title: 'Section Alpha'
    ShowTitle: 1
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_page
  section_beta:
    Title: 'Section Beta'
    ShowTitle: 1
    Sort: 2
    Zone: main
    Parent: =>Page.e2e_page

WeDevelop\Grid\Model\Row:
  row_a1:
    Title: 'Row Alpha-1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section_alpha
  row_a2:
    Title: 'Row Alpha-2'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Section.section_alpha
  row_b1:
    Title: 'Row Beta-1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section_beta

WeDevelop\Grid\Model\Column:
  col_a1:
    Title: 'Column A1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_a1
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'
  col_a2:
    Title: 'Column A2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_a2
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'
  col_b1:
    Title: 'Column B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_b1
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'

WeDevelop\Grid\Model\ContentElement:
  block_a1:
    Title: 'Block A1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a1
  block_a2:
    Title: 'Block A2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a2
  block_b1:
    Title: 'Block B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_b1
