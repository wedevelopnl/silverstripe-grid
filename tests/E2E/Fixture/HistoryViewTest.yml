# E2E fixture: a draft page with one known section, used to verify the history
# viewer renders the readonly grid for a specific version.
#
# Registered with NO post_actions (see _config/dev.yml): the spec creates every
# version through real user actions — publish, add a second section, publish
# again — so each entry in the resulting history is the validated result of an
# interaction rather than a fixture side-effect. It then opens the newest
# version and asserts it renders the post-edit tree (two sections) readonly.
#
# Top-down ordering (page → section → row → column → leaf) so the
# `=>ClassName.id` parent references resolve; the FixtureLoader forces
# auto_scaffold = false, so this cannot produce duplicate children.

Page:
  e2e_history_page:
    Title: 'E2E History Page'
    URLSegment: 'e2e-history-page'

WeDevelop\Grid\Model\Section:
  history_section_alpha:
    Title: 'Original Alpha Section'
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_history_page

WeDevelop\Grid\Model\Row:
  history_row_alpha:
    Title: 'Alpha Row'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.history_section_alpha

WeDevelop\Grid\Model\Column:
  history_col_alpha:
    Title: 'Alpha Column'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.history_row_alpha
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'

WeDevelop\Grid\Model\ContentElement:
  history_leaf_alpha:
    Title: 'Original Alpha Leaf'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.history_col_alpha
