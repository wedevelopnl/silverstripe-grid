# Fixture backing the documentation screenshots (docs/images/).
#
# Unlike the specs' fixtures this one is not asserted against — it exists so
# `npm run docs:screenshots` always captures the same page. Content is
# deliberately realistic (a small marketing site) rather than descriptive of
# test states, because the captures end up in the README.
#
# Structure, sized for the Bootstrap preset's 12-column grid:
#
#   Home
#     Hero            — one full-width column
#     What we do      — centred 8/12 intro, then a 4+4+4 card row
#     Get in touch    — 7+5 split; the 5 column is hidden on xs
#
# The last section carries the versioned states (one draft-only block, one
# modified block) so the status badges appear in a screenshot without
# cluttering the sections used for the README hero shot.
#
# Top-down ordering: parents before children. Auto-scaffolding suppressed by
# FixtureLoader. The 'e2e-' URLSegment prefix is what reset() keys cleanup on.

Page:
  e2e_page:
    Title: 'Home'
    URLSegment: 'e2e-docs-home'

# --- Shared block library ---
# Section-rooted, and deliberately NOT placed on the page: it exists so the
# placement caret's menu has something real behind it in the screenshot, while
# the page's own structure — and every other capture — stays unchanged.
WeDevelop\Grid\Model\SharedBlock:
  cta_block:
    Title: 'Newsletter call to action'

# --- Sections (into page, and one into the block) ---
WeDevelop\Grid\Model\Section:
  cta_section:
    Title: 'Newsletter call to action'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\SharedBlock.cta_block
  hero_section:
    Title: 'Hero'
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_page
  services_section:
    Title: 'What we do'
    Sort: 2
    Zone: main
    Parent: =>Page.e2e_page
  contact_section:
    Title: 'Get in touch'
    Sort: 3
    Zone: main
    Parent: =>Page.e2e_page

# --- Rows (into sections) ---
WeDevelop\Grid\Model\Row:
  cta_row:
    Title: 'Signup'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.cta_section
  hero_row:
    Title: 'Banner'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.hero_section
  intro_row:
    Title: 'Introduction'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.services_section
  cards_row:
    Title: 'Service cards'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Section.services_section
  contact_row:
    Title: 'Details'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.contact_section

# --- Columns (into rows) ---
WeDevelop\Grid\Model\Column:
  cta_col:
    Title: 'Full width'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.cta_row
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'
  hero_col:
    Title: 'Full width'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.hero_row
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'
  intro_col:
    Title: 'Centred intro'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.intro_row
    GridSettings: '{"default":{"width":8,"offset":2,"visible":true},"overrides":{"xs":{"width":12,"offset":0,"visible":true}}}'
  card_design_col:
    Title: 'Design'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.cards_row
    GridSettings: '{"default":{"width":4,"offset":0,"visible":true},"overrides":{"xs":{"width":12,"offset":0,"visible":true}}}'
  card_build_col:
    Title: 'Build'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Row.cards_row
    GridSettings: '{"default":{"width":4,"offset":0,"visible":true},"overrides":{"xs":{"width":12,"offset":0,"visible":true}}}'
  card_support_col:
    Title: 'Support'
    Sort: 3
    Parent: =>WeDevelop\Grid\Model\Row.cards_row
    GridSettings: '{"default":{"width":4,"offset":0,"visible":true},"overrides":{"xs":{"width":12,"offset":0,"visible":true}}}'
  contact_text_col:
    Title: 'Contact text'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.contact_row
    GridSettings: '{"default":{"width":7,"offset":0,"visible":true},"overrides":{}}'
  contact_aside_col:
    Title: 'Office details'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Row.contact_row
    GridSettings: '{"default":{"width":5,"offset":0,"visible":true},"overrides":{"xs":{"width":12,"offset":0,"visible":false}}}'

# --- Content blocks (into columns) ---
WeDevelop\Grid\Model\ContentElement:
  cta_content:
    Title: 'Stay in the loop'
    HTML: '<p>One short email a month about what we shipped.</p>'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.cta_col
  hero_block:
    Title: 'Publish faster'
    HTML: '<p>Give editors a real layout tool without handing them a page builder they can break.</p>'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.hero_col
  intro_block:
    Title: 'Introduction'
    HTML: '<p>We design, build and maintain content-heavy websites for organisations that publish every day.</p>'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.intro_col
  design_block:
    Title: 'Design'
    HTML: '<p>Research, wireframes and a design system your team can extend.</p>'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.card_design_col
  build_block:
    Title: 'Build'
    HTML: '<p>Accessible front-end and a CMS your editors actually enjoy using.</p>'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.card_build_col
  support_block:
    Title: 'Support'
    HTML: '<p>Monitoring, security updates and a support desk with a real SLA.</p>'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.card_support_col
  contact_intro_block:
    Title: 'Say hello'
    HTML: '<p>Tell us about the project and we will get back to you within two working days.</p>'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.contact_text_col
  opening_hours_block:
    Title: 'Opening hours'
    HTML: '<p>Weekdays from 09:00 to 17:30.</p>'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Column.contact_text_col
  office_block:
    Title: 'Office'
    HTML: '<p>Stationsplein 1, Utrecht.</p>'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.contact_aside_col
