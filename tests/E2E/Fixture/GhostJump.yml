# E2E fixture for ghost-jump regression test: minimal 2-sibling row structure.
#
# Structure:
#   Page (E2E Ghost Jump Test):
#     Section (Sort: 1)
#       Row 1 (Sort: 1)
#         Column 1 (Sort: 1) — Block 1
#       Row 2 (Sort: 2)
#         Column 2 (Sort: 1) — Block 2

Page:
  e2e_page:
    Title: 'E2E Ghost Jump Test'
    URLSegment: 'e2e-ghost-jump'

WeDevelop\Grid\Model\Section:
  section:
    Title: 'Section'
    ShowTitle: 1
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_page

WeDevelop\Grid\Model\Row:
  row1:
    Title: 'Row 1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section
  row2:
    Title: 'Row 2'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Section.section

WeDevelop\Grid\Model\Column:
  col1:
    Title: 'Column 1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row1
    GridSettings: '{}'
  col2:
    Title: 'Column 2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row2
    GridSettings: '{}'

WeDevelop\Grid\Model\ContentElement:
  block1:
    Title: 'Block 1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col1
  block2:
    Title: 'Block 2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col2
