# E2E fixture for Playwright: Section > Row > Column > leaf hierarchy.
#
# Uses Page (not TestPage) because TestOnly classes are not available
# at runtime — only during PHPUnit execution.
#
# Top-down ordering: parents written before children so =>ClassName.id
# references resolve. Auto-scaffolding is suppressed by FixtureLoader.
#
# All pages use the 'e2e-' URLSegment prefix for cleanup identification.
#
# Elements parent directly to their container via polymorphic has_one (Parent).
# No intermediary area model.
#
# Columns store neutral baseline GridSettings (full-width default, no
# overrides). Specs that exercise override behaviour set overrides through
# the UI at test time — this keeps fixtures adapter-agnostic (no viewport
# keys hardcoded) and keeps the test describing the user journey instead
# of asserting pre-loaded state.

Page:
  e2e_page:
    Title: 'E2E Grid Test Page'
    URLSegment: 'e2e-grid-test'

# --- Section (into page) ---
WeDevelop\Grid\Model\Section:
  section1:
    Title: 'Main Section'
    ShowTitle: 1
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_page

# --- Row (into section) ---
WeDevelop\Grid\Model\Row:
  row1:
    Title: 'First Row'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section1

# --- Columns (into row) ---
WeDevelop\Grid\Model\Column:
  col1:
    Title: 'Left Column'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row1
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'
  col2:
    Title: 'Right Column'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Row.row1
    GridSettings: '{"default":{"width":12,"offset":0,"visible":true},"overrides":{}}'

# --- Leaves (into columns) ---
WeDevelop\Grid\Model\ContentElement:
  leaf1:
    Title: 'Text Block'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col1
  leaf2:
    Title: 'Image Block'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Column.col1
  leaf3:
    Title: 'Video Block'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col2
