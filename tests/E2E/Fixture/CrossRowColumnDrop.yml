# E2E fixture for cross-row column drop position tests.
#
# Structure:
#   Page (E2E Cross Row Column Drop):
#     Section (Sort: 1)
#       Row A (Sort: 1)
#         Col A1 (Sort: 1, width: 3) — Block A1
#         Col A2 (Sort: 2, width: 3) — Block A2
#         Col A3 (Sort: 3, width: 3) — Block A3
#       Row B (Sort: 2)
#         Col B1 (Sort: 1, width: 3) — Block B1
#         Col B2 (Sort: 2, width: 3) — Block B2
#         Col B3 (Sort: 3, width: 3) — Block B3
#
# Single section, two rows, each with 3 columns (width:3 = 1/4 of 12-col grid).
# Width:3 ensures 4 columns fit on one line during drag (4 × 3/12 = 100%).
# Tests cover column drops at all positions between rows.

Page:
  e2e_page:
    Title: 'E2E Cross Row Column Drop'
    URLSegment: 'e2e-cross-row-column-drop'

WeDevelop\Grid\Model\Section:
  section:
    Title: 'Section'
    ShowTitle: 1
    Sort: 1
    Zone: main
    Parent: =>Page.e2e_page

WeDevelop\Grid\Model\Row:
  row_a:
    Title: 'Row A'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Section.section
  row_b:
    Title: 'Row B'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Section.section

WeDevelop\Grid\Model\Column:
  col_a1:
    Title: 'Col A1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_a
    GridSettings: '{"md":{"width":3,"offset":0,"visible":true}}'
  col_a2:
    Title: 'Col A2'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Row.row_a
    GridSettings: '{"md":{"width":3,"offset":0,"visible":true}}'
  col_a3:
    Title: 'Col A3'
    Sort: 3
    Parent: =>WeDevelop\Grid\Model\Row.row_a
    GridSettings: '{"md":{"width":3,"offset":0,"visible":true}}'
  col_b1:
    Title: 'Col B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Row.row_b
    GridSettings: '{"md":{"width":3,"offset":0,"visible":true}}'
  col_b2:
    Title: 'Col B2'
    Sort: 2
    Parent: =>WeDevelop\Grid\Model\Row.row_b
    GridSettings: '{"md":{"width":3,"offset":0,"visible":true}}'
  col_b3:
    Title: 'Col B3'
    Sort: 3
    Parent: =>WeDevelop\Grid\Model\Row.row_b
    GridSettings: '{"md":{"width":3,"offset":0,"visible":true}}'

WeDevelop\Grid\Model\ContentElement:
  block_a1:
    Title: 'Block A1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a1
  block_a2:
    Title: 'Block A2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a2
  block_a3:
    Title: 'Block A3'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_a3
  block_b1:
    Title: 'Block B1'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_b1
  block_b2:
    Title: 'Block B2'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_b2
  block_b3:
    Title: 'Block B3'
    Sort: 1
    Parent: =>WeDevelop\Grid\Model\Column.col_b3
