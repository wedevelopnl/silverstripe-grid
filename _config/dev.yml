    archive-test:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/ArchiveTest.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    media-elements:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/MediaElements.yml'
      post_actions:
        - action: attach_image
          class: 'WeDevelop\Grid\Model\ContentElement'
          identifier: media_element
          fields:
            relation: MediaImage
            source: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/assets/test-image.png'
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    duplicate-test:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/DuplicateTest.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_source_page
        - action: publish_recursive
          class: 'WeDevelop\Grid\Dev\MultiZonePage'
          identifier: e2e_target_page
    complex-page:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/ComplexPage.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
        - action: unpublish
          class: 'WeDevelop\Grid\Model\ContentElement'
          identifier: draft_leaf
        - action: modify
          class: 'WeDevelop\Grid\Model\ContentElement'
          identifier: modified_leaf
          fields:
            Title: 'Modified Text Block (draft)'
        - action: modify
          class: 'WeDevelop\Grid\Model\Row'
          identifier: row1
          fields:
            Title: 'First Row (modified)'
        - action: unpublish
          class: 'WeDevelop\Grid\Model\Section'
          identifier: section2
    validation-errors:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/ValidationErrors.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    viewport-cascade:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/ViewportCascade.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    history-view-test:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/HistoryViewTest.yml'
      # No post_actions: the history-view E2E spec creates all versions
      # via user actions (publish, edit, publish again) so each version
      # in the resulting history is the validated result of a real
      # interaction, not a fixture side-effect.
