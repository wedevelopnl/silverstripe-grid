---
Name: grid-dev
Only:
  environment: dev
---

# E2E fixtures are served by the wedevelopnl/silverstripe-e2e module (dev
# dependency): it registers the /dev/e2e-fixtures endpoint and relaxes
# Session.strict_user_agent_check for the Playwright browser contexts. This
# block only supplies the grid's own fixtures and domain behavior.
#
# SECURITY: the endpoint is intentionally unauthenticated (its /reset action is
# a data-wipe primitive). The dev-only gating that makes this safe lives in the
# module: WeDevelop\E2e\Fixtures\FixtureController gates on Director::isDev()
# (canInit() + a defence-in-depth 404), and its _config registers the route
# with `Only: environment: dev`. Read that class before exposing this anywhere.
# The module's reset() only archives SiteTree pages, so shared blocks — library
# records with no page and no URL — accumulated one per run. The subclass sweeps
# the unreferenced ones after the pages are gone. Test-only class, autoloaded via
# the container's autoload-dev mapping.
SilverStripe\Core\Injector\Injector:
  WeDevelop\E2e\Fixtures\FixtureLoader:
    class: WeDevelop\Grid\Tests\E2E\Support\GridFixtureLoader

WeDevelop\E2e\Fixtures\FixtureLoader:
  # reset() archives only pages whose ClassName is listed here AND whose
  # URLSegment starts with "e2e-". Every SiteTree page type the fixtures
  # create must be listed — FixtureEndpointTest guards this.
  # Both entries are harness-app page types (see .docker/app/src/), not module
  # classes — the grid ships no page type of its own.
  fixture_page_classes:
    - Page
    - App\MultiZonePage
  # Grid fixtures are authored top-down (page → section → row → column → leaf),
  # so every container's children are declared in the YAML. The module forces
  # these statics off only for the duration of each fixture write, so
  # GridElement::onAfterWrite() does not scaffold an extra Row/Column that would
  # duplicate the ones the fixture creates itself.
  config_overrides:
    WeDevelop\Grid\Model\Section:
      auto_scaffold: false
    WeDevelop\Grid\Model\Row:
      auto_scaffold: false
  fixtures:
    element-tree:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/ElementTree.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    empty-page: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/EmptyPage.yml'
    collapse-test: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CollapseTest.yml'
    drag-and-drop:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/DragAndDrop.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    multi-zone:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/MultiZone.yml'
      post_actions:
        - action: publish_recursive
          class: 'App\MultiZonePage'
          identifier: e2e_multi_zone_page
    content-elements:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/ContentElements.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    ghost-jump:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/GhostJump.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-section-drop:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossSectionDrop.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-section-drop-single:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossSectionDropSingle.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-section-drop-single-reverse:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossSectionDropSingleReverse.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-row-column-drop:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossRowColumnDrop.yml'
      post_actions:
        - action: publish_recursive
          class: Page
