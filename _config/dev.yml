---
Name: grid-dev
Only:
  environment: dev
---

# Playwright's setup project and chromium project use different user agents
# (real browser vs devices['Desktop Chrome']), which triggers session invalidation.
SilverStripe\Control\Session:
  strict_user_agent_check: false

SilverStripe\Dev\DevelopmentAdmin:
  controllers:
    grid-fixtures:
      class: 'WeDevelop\Grid\Dev\FixtureController'
      description: 'Load and reset E2E fixtures for grid'

WeDevelop\Grid\Dev\FixtureLoader:
  fixtures:
    element-tree:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/ElementTree.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    empty-page: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/EmptyPage.yml'
    collapse-test: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CollapseTest.yml'
    drag-and-drop:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/DragAndDrop.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    multi-zone:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/MultiZone.yml'
      post_actions:
        - action: publish_recursive
          class: 'WeDevelop\Grid\Dev\MultiZonePage'
          identifier: e2e_multi_zone_page
    content-elements:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/ContentElements.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    ghost-jump:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/GhostJump.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-container-ghost:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossContainerGhost.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-section-drop:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossSectionDrop.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-section-drop-single:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossSectionDropSingle.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-section-drop-single-reverse:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossSectionDropSingleReverse.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-row-column-drop:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossRowColumnDrop.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-row-column-drop-single:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossRowColumnDropSingle.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-column-element-drop:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossColumnElementDrop.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-column-element-drop-single:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossColumnElementDropSingle.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    archive-test:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/ArchiveTest.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    media-elements:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/MediaElements.yml'
      post_actions:
        - action: attach_image
          class: 'WeDevelop\Grid\Model\ContentElement'
          identifier: media_element
          fields:
            relation: MediaImage
            source: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/assets/test-image.png'
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    duplicate-test:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/DuplicateTest.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_source_page
        - action: publish_recursive
          class: 'WeDevelop\Grid\Dev\MultiZonePage'
          identifier: e2e_target_page
    complex-page:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/ComplexPage.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
        - action: unpublish
          class: 'WeDevelop\Grid\Model\ContentElement'
          identifier: draft_leaf
        - action: modify
          class: 'WeDevelop\Grid\Model\ContentElement'
          identifier: modified_leaf
          fields:
            Title: 'Modified Text Block (draft)'
        - action: modify
          class: 'WeDevelop\Grid\Model\Row'
          identifier: row1
          fields:
            Title: 'First Row (modified)'
        - action: unpublish
          class: 'WeDevelop\Grid\Model\Section'
          identifier: section2
