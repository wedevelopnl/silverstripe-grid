    cross-column-element-drop-single:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossColumnElementDropSingle.yml'
      post_actions:
        - action: publish_recursive
          class: Page
          identifier: e2e_page
    cross-column-element-drop-single-reverse:
      path: 'wedevelopnl/silverstripe-grid:tests/E2E/Fixture/CrossColumnElementDropSingleReverse.yml'
      post_actions:
        - action: publish_recursive
