---
Name: grid-keys-for-cache
Only:
  moduleexists: silverstripe-terraformers/keys-for-cache
---
WeDevelop\Grid\Model\GridElement:
  has_cache_key: true
WeDevelop\Grid\Model\Section:
  cares:
    - Rows
WeDevelop\Grid\Model\Row:
  cares:
    - Columns
WeDevelop\Grid\Model\Column:
  cares:
    - Elements
# A placement holds none of its block's content, so the change has to travel
# from the block to every placement. `References` exists for that edge alone and
# adds no column. It is `touches` on the block, not `cares: [Block]` on the
# placement: KFC resolves an undotted `cares` by Injector::get() of the class,
# a singleton placement whose injected SharedBlockUsageResolver then outlives
# the request scope and serves stale usage.
WeDevelop\Grid\Model\SharedBlock:
  has_many:
    References: WeDevelop\Grid\Model\SharedBlockReference.Block
  scaffold_cms_fields_settings:
    ignoreRelations:
      - References
  touches:
    - References
