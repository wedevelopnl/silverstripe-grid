---
Name: grid-adapter
---

SilverStripe\Core\Injector\Injector:
  WeDevelop\Grid\Contract\GridAdapterInterface:
    factory: WeDevelop\Grid\Factory\GridAdapterResolver
  # Injected into Column via $dependencies so the configured override strategy
  # applies. Injector does not auto-wire the adapter constructor argument, so it
  # is referenced explicitly here.
  WeDevelop\Grid\Service\GridSettingsResolver:
    constructor:
      adapter: '%$WeDevelop\Grid\Contract\GridAdapterInterface'
      overrideStrategy: isolated

# The active adapter is selected by the SS_GRID_ADAPTER environment variable.
# The value is either a bundled preset name (bootstrap|tailwind|bulma,
# case-insensitive) or the FQCN of a custom adapter that implements
# GridAdapterInterface. The variable is required — unset or invalid values
# throw at container boot.
#
# To configure the active adapter:
#
# WeDevelop\Grid\Adapter\BootstrapAdapter:
#   enabled_viewports:
#     - sm
#     - md
#     - lg
#   total_columns: 16
#   default_viewport: lg
#   container_max_width: 1400
#
# To change the override strategy to cascade, re-declare the constructor
# (including the adapter reference, since Injector does not auto-wire it):
#
# SilverStripe\Core\Injector\Injector:
#   WeDevelop\Grid\Service\GridSettingsResolver:
#     constructor:
#       adapter: '%$WeDevelop\Grid\Contract\GridAdapterInterface'
#       overrideStrategy: cascade
