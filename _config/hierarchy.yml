---
Name: grid-validation
---

WeDevelop\Grid\Model\GridElement:
  extensions:
    HierarchyValidation: WeDevelop\Grid\Validation\HierarchyValidationExtension

---
Name: grid-services
After:
  - '#grid-validation'
---

SilverStripe\Core\Injector\Injector:
  WeDevelop\Grid\Validation\HierarchyValidatorInterface:
    class: WeDevelop\Grid\Validation\HierarchyValidationService
  WeDevelop\Grid\Repository\GridElementRepositoryInterface:
    class: WeDevelop\Grid\Repository\OrmGridElementRepository
  WeDevelop\Grid\Service\GridNodeMapper: ~
  WeDevelop\Grid\Service\GridTreeService:
    constructor:
      elementRepository: '%$WeDevelop\Grid\Repository\GridElementRepositoryInterface'
      nodeMapper: '%$WeDevelop\Grid\Service\GridNodeMapper'
  WeDevelop\Grid\Contract\ReorderValidatorInterface:
    class: WeDevelop\Grid\Validation\ReorderValidator
  WeDevelop\Grid\Service\RequestBodyParser:
    constructor:
      gridAdapter: '%$WeDevelop\Grid\Contract\GridAdapterInterface'
  WeDevelop\Grid\Service\ElementPlacementService:
    constructor:
      validator: '%$WeDevelop\Grid\Contract\ReorderValidatorInterface'
      elementRepository: '%$WeDevelop\Grid\Repository\GridElementRepositoryInterface'
  WeDevelop\Grid\Service\GridElementService:
    constructor:
      validator: '%$WeDevelop\Grid\Contract\ReorderValidatorInterface'
      placementService: '%$WeDevelop\Grid\Service\ElementPlacementService'
  WeDevelop\Grid\Service\GridSettingsService:
    constructor:
      gridAdapter: '%$WeDevelop\Grid\Contract\GridAdapterInterface'
      treeService: '%$WeDevelop\Grid\Service\GridTreeService'
