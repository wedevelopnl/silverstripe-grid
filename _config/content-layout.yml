---
Name: grid-content-layout
After:
  - '#grid-adapter'
---

SilverStripe\Core\Injector\Injector:
  WeDevelop\Grid\Contract\ContentLayoutAdapterInterface:
    factory: WeDevelop\Grid\Factory\GridAdapterFactory

# BlockMediaExtension is intentionally NOT applied here. ContentElement ships
# lean (HTML only); a lone image or video is the shipped MediaElement (which
# carries MediaExtension itself). Projects that want media beside the HTML apply
# the extension to ContentElement (or their own content subclass) in their app
# config:
#
#   WeDevelop\Grid\Model\ContentElement:
#     extensions:
#       - WeDevelop\Grid\Extensions\BlockMediaExtension
#
# The SS5->SS6 migration runs with or without it: media settings the target
# class has no column for stay in the legacy tables and are reported at the end
# of the run. A project that wants its legacy media carried over opts the
# extension in (on ContentElement, or on the subclass it remaps to) before
# migrating. See docs/migration.md.
