---
Name: grid-fluent
Only:
  classexists: TractorCow\Fluent\Extension\FluentIsolatedExtension
---
SilverStripe\CMS\Model\SiteTree:
  extensions:
    FluentGrid: WeDevelop\Grid\Extensions\FluentGridPageExtension
  # UseGrid is structural config, not per-locale content. The SS5->SS6 migration
  # writes it on the page base table via raw SQL (GridMigrationService::setUseGridOnPage),
  # so excluding it from Fluent field-localisation keeps that write authoritative
  # across every locale rather than scoped to the active one.
  field_exclude:
    - UseGrid

WeDevelop\Grid\Model\SharedBlock:
  extensions:
    FluentSharedBlock: WeDevelop\Grid\Extensions\FluentSharedBlockExtension

SilverStripe\Core\Injector\Injector:
  TractorCow\Fluent\Model\Delete\DeleteLocalisationPolicy:
    class: WeDevelop\Grid\Service\GridAwareDeleteLocalisationPolicy
  WeDevelop\Grid\Service\LocalisedSubtreeCloner:
    constructor:
      treeService: '%$WeDevelop\Grid\Service\GridTreeService'
